name: Invalidations

on:
  pull_request:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Only run on PRs to the default branch.
    # In the PR trigger above branches can be specified only explicitly whereas this check should work for master, main, or any other default branch
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1.10'
    - uses: actions/checkout@v7
    - uses: julia-actions/cache@v3
    - name: Pkg.develop HDF5DocURLs (Julia 1.10 doesn't honor [sources])
      # TODO: remove once HDF5DocURLs is registered in General with subdir="HDF5DocURLs"
      # Guarded on isdir since the default-branch checkout below won't have
      # HDF5DocURLs/ until this PR is merged.
      shell: julia --project=@. {0}
      run: |
        using Pkg
        isdir("HDF5DocURLs") && Pkg.develop(PackageSpec(path="HDF5DocURLs"))
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-invalidations@v1
      id: invs_pr

    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.repository.default_branch }}
    - name: Pkg.develop HDF5DocURLs (Julia 1.10 doesn't honor [sources])
      # TODO: remove once HDF5DocURLs is registered in General with subdir="HDF5DocURLs"
      # Guarded on isdir since the default branch won't have HDF5DocURLs/ until
      # this PR is merged.
      shell: julia --project=@. {0}
      run: |
        using Pkg
        isdir("HDF5DocURLs") && Pkg.develop(PackageSpec(path="HDF5DocURLs"))
    - uses: julia-actions/julia-buildpkg@v1
    - uses: julia-actions/julia-invalidations@v1
      id: invs_default

    - name: Report invalidation counts
      run: |
        echo "Invalidations on default branch: ${{ steps.invs_default.outputs.total }} (${{ steps.invs_default.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
        echo "This branch: ${{ steps.invs_pr.outputs.total }} (${{ steps.invs_pr.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
    - name: Check if the PR does increase number of invalidations
      if: steps.invs_pr.outputs.total > steps.invs_default.outputs.total
      run: exit 1
