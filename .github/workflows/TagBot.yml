name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: 3
permissions:
  contents: write
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # An empty subdir is the top-level HDF5 package (tags `vX.Y.Z`);
        # subdirectory packages are tagged `<Name>-vX.Y.Z`.
        subdir:
          - ''
          - HDF5DocURLs
          - filters/H5Zbitshuffle
          - filters/H5Zblosc
          - filters/H5Zbzip2
          - filters/H5Zlz4
          - filters/H5Zzstd
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: ${{ matrix.subdir }}
